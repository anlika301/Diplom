# Airflow DWH — CeleryExecutor (параллельный MAG + BAK)
#
# Инфраструктура:
#   postgres  — внутренняя БД метаданных Airflow (НЕ Supabase)
#   redis     — брокер задач Celery
#   worker    — выполняет таски параллельно
#
# Supabase credentials:
#   MAG пайплайн читает /opt/airflow/.env.mag
#   BAK пайплайн читает /opt/airflow/.env.bak
#   Каждый BashOperator таск сам подгружает нужный файл через `source`
#
# Быстрый старт:
#   docker-compose -p dwh-airflow -f docker-compose.airflow.yml build
#   docker-compose -p dwh-airflow -f docker-compose.airflow.yml up airflow-init
#   docker-compose -p dwh-airflow -f docker-compose.airflow.yml up -d
#   Открыть http://localhost:8080  (airflow / airflow)
#   Положить Excel файлы в data/mag/ и data/bak/
#   Запустить DAG etl_dwh_combined

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./etl_mag_modular:/opt/airflow/etl_mag_modular
    - ./etl_bak_modular:/opt/airflow/etl_bak_modular
    - ./data:/opt/airflow/data          # Excel файлы — data/mag/ и data/bak/
    - ./.env.mag:/opt/airflow/.env.mag:ro   # Supabase credentials для MAG
    - ./.env.bak:/opt/airflow/.env.bak:ro   # Supabase credentials для BAK
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ── Инфраструктура ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Airflow — инициализация (запустить один раз) ────────────────────────────

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        airflow variables set FOLDER_MAG /opt/airflow/data/mag || true
        airflow variables set FOLDER_BAK /opt/airflow/data/bak || true
        echo "=== Init complete. Open http://localhost:8080 (airflow / airflow) ==="
    user: "0:0"
    depends_on:
      <<: *airflow-common-depends-on

  # ── Airflow — основные сервисы ──────────────────────────────────────────────

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  airflow-postgres-data:
